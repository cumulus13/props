name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  
permissions:
  contents: write

env:
  GONOSUMDB: "*"
  GOFLAGS: ""

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Build all platform binaries in parallel
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: props-windows-amd64.exe
          - goos: windows
            goarch: "386"
            output: props-windows-386.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false   # disable cache — let go mod tidy handle deps fresh

      - name: Tidy & verify dependencies
        # go mod tidy regenerates go.sum completely using proxy.golang.org
        # GONOSUMDB=* skips sum.golang.org verification (not needed for open source deps)
        run: |
          go mod tidy
          go mod verify
        env:
          GONOSUMDB: "*"
          GOPROXY: "https://proxy.golang.org,direct"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          GONOSUMDB: "*"
          GOPROXY: "https://proxy.golang.org,direct"
        run: |
          mkdir -p dist
          go build \
            -ldflags="-s -w \
              -X main.version=${{ github.ref_name }} \
              -X 'main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)' \
              -X main.commit=${{ github.sha }}" \
            -o dist/${{ matrix.output }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # Create GitHub Release and attach all binaries
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum * > checksums.txt
          echo "=== checksums.txt ==="
          cat checksums.txt

      - name: Extract changelog for this tag
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/^## \[?${TAG//v/}\]?/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          echo "$NOTES" > /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "props-go ${{ github.ref_name }}"
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/props-windows-amd64.exe
            dist/props-windows-386.exe
            dist/checksums.txt

  